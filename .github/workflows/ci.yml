name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Format check
        working-directory: services/api
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        working-directory: services/api
        run: go test -race -cover ./...
      - name: Static analysis
        working-directory: services/api
        run: go vet ./...

  web:
    name: Web · TypeScript, schemas, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Validate Open Watch Graph manifests
        run: npm run validate:manifests
      - name: Production build
        run: npm run build

  database:
    name: PostgreSQL · Migration and RLS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Bootstrap minimal Supabase auth roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $body$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $body$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply Cinema migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261101000000_cinema_core.sql
      - name: Run rights and RLS integration checks
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/schema_smoke.sql

  openapi:
    name: OpenAPI · Contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.72.1 lint --extends=spec openapi/cinema.v1.yaml
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_NOTIFICATIONS: "true"

  android:
    name: Android · Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [[ -d "${sdk_root}/platforms/android-37.0" && ! -e "${sdk_root}/platforms/android-37" ]]; then
            ln -s android-37.0 "${sdk_root}/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK and compute checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cinema-debug-apk-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
