name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Format check
        working-directory: services/api
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        working-directory: services/api
        run: go test -race -cover ./...
      - name: Static analysis
        working-directory: services/api
        run: go vet ./...

  web:
    name: Web · TypeScript, schemas, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Validate Open Watch Graph manifests
        run: npm run validate:manifests
      - name: Production build
        run: npm run build

  android:
    name: Android · Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
